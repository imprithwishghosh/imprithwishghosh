  <linearGradient id="blue" x1="0" x2="1">
    <stop offset="0%" stop-color="#5794F2"/>
    <stop offset="100%" stop-color="#73A9FF"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

